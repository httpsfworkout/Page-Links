<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind -->
    <link href="./output.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" integrity="sha512-9xKTRVabjVeZmc+GUW8GgSmcREDunMM+Dt/GrzchfN8tkwHizc5RP4Ok/MXFFy5rIjJjzhndFScTceq5e6GvVQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

    <title>Page Links</title>
</head>
<body>
    <main>
        <div class="flex flex-col justify-center items-center w-full h-screen m-auto gap-8">
            <div class="flex flex-col justify-center items-center gap-2.5 select-none">
                <img
                    src="/images/Slam dunk edited.jpg"
                    alt="Profile"
                    class="w-[10%] rounded-[50%]">

                <h2 class="text-white text-xl font-semibold">Davi <span class="freitas" title="“A virtude tem um preço alto, mas é o único pagamento que nunca empobrece quem o faz.”">Freitas</span></h2>
                <p class="text-[#8E96A3]">Desenvolvedor Front-end <i class="fa-solid fa-laptop"></i></p>
            </div>

            <div class="flex flex-col justify-center items-center text-center gap-6 w-[80%] text-[#e5e5e5] text-xl font-bold md:w-[30%]">
                <a href="https://www.linkedin.com/in/fworkout" class="p-3 w-full border border-transparent rounded-md bg-[rgba(255,255,255,0.06)] hover:bg-[rgba(255,255,255,0.12)] backdrop-blur-md transition-all transform hover:-translate-y-0.5 hover:text-sky-600  duration-300"><i class="fa-brands fa-linkedin"></i> Linkedin</a>
                <a href="https://x.com/httpsfworkout" class="p-3 w-full border border-transparent rounded-md bg-[rgba(255,255,255,0.06)] hover:bg-[rgba(255,255,255,0.12)] backdrop-blur-md transition transform hover:-translate-y-0.5 hover:text-neutral-950 duration-300"><i class="fa-brands fa-x-twitter hover:text-black transition-colors duration-300"></i> Twitter</a>
                <a href="https://github.com/httpsfworkout" class="p-3 w-full border border-transparent rounded-md bg-[rgba(255,255,255,0.06)] hover:bg-[rgba(255,255,255,0.12)] backdrop-blur-md transition transform hover:-translate-y-0.5 hover:text-neutral-950 duration-300"><i class="fa-brands fa-github"></i> GitHub</a>
                <a href="https://bsky.app/profile/httpsfworkout.bsky.social" class="p-3 w-full rounded-md bg-[rgba(255,255,255,0.06)] hover:bg-[rgba(255,255,255,0.12)] backdrop-blur-md transition transform hover:-translate-y-0.5 hover:text-sky-500 duration-300"><i class="fa-brands fa-bluesky"></i> Bluesky</a>
            </div>
        </div>
    </main>
    <footer>
        <div class="flex flex-col justify-center items-center text-center text-neutral-200 select-none my-4">
            <span>&copy; davi freitas 2025</span>
        </div>
    </footer>
</body>
</html>
